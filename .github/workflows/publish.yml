name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "❌ package.json version ($PACKAGE_VERSION) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi
          echo "✅ Version match confirmed: $RELEASE_TAG"

      - name: Publish to npm
        run: npm publish --access public
        # NODE_AUTH_TOKEN is not needed — OIDC trusted publishing handles auth automatically
